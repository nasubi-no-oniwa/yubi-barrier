# 人数カウンターを数えなおし、今日のランキングの ds を足す（手で動かすときだけ）
name: 人数カウンターを数えなおす
on:
  workflow_dispatch:
jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 道具を入れる
        run: mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && npm init -y >/dev/null && npm i google-auth-library@9 --silent
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FT_GREEN_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FT_GREEN_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: 数えなおす
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          ROOT: yubi
          NODES: cut,take
          DSMUL: 1000
          SKEY: s
        run: node tools/cnt-init.mjs
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
