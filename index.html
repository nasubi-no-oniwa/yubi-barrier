 if(!ks.length)h+='<tr><td></td><td colspan="2">'+t('empty')+'</td></tr>';return h+'</table>';}

function frame(dt,now){CLK+=dt;mT+=dt;
 if(mode==='title'||mode==='result'){calmPrice(dt);chStep(dt);}
 else if(mode==='mv')mvUpdate(dt);
 else if(mode==='play')playUpdate(dt,now);
 popStep();tickStep();
 if(fadeTo!=null){fadeA=lerp(fadeA,fadeTo,1-Math.exp(-dt*7));if(Math.abs(fadeA-fadeTo)<.01){fadeA=fadeTo;fadeTo=null;}}
 $('fade').style.opacity=fadeA.toFixed(3);
 CX.setTransform(DPR,0,0,DPR,0,0);const sh=shakeA>0?shakeA*6:0;shakeA*=Math.pow(.05,dt);if(shakeA<.01)shakeA=0;CX.save();if(sh)CX.translate((Math.random()-.5)*sh,(Math.random()-.5)*sh);drawChart(CX,W,Hh,false);CX.restore();
 flashA*=Math.pow(.02,dt);$('flash').style.opacity=flashA.toFixed(3);
 if(mode==='mv'){drawChart(MX,MINI.width,MINI.height,true);mtex.needsUpdate=true;R.render(S,CAM);}
 else{handStep(dt,now);HAND.visible=(mode==='play');R.render(FS,FC);if(mode==='play'){pipStep(dt);R2.render(S,CAM2);}}}
let last=performance.now();
function loop(now){requestAnimationFrame(loop);const dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;frame(dt,now);}

 CX.setTransform(DPR,0,0,DPR,0,0);drawChart(CX,W,Hh,false);HS.x=W*(SHARE?.82:OGP?.62:.6);HS.y=CH.bar.y;HS.touch=1;HS.tx=HS.x;HS.ty=HS.y;HS.vx=900;G={ph:'drop'};handStep(.5,0);HAND.visible=true;tipGlow.material.opacity=.5;R.render(FS,FC);
 if(OGP){$('ogpT').hidden=false;$('ogpT').innerHTML='<b>指バリア</b><i>FINGER BARRIER</i><s>こすって、下落を止めろ。</s>';}

  else if(SHARE==='take')d.innerHTML=lg+'<div class="word take">利確</div><div class="ttl">称号「利確できる人」</div><div class="en">Can Actually Take Profit</div>';
  else d.innerHTML=lg+'<div class="num"><b>'+n+'</b><span>回耐えた</span></div><div class="ttl">称号「'+esc(TX.ja.grades[gi])+'」</div><div class="en">Held '+n+' drop'+(n===1?'':'s')+' · '+esc(TX.en.grades[gi])+'</div>';
  document.body.appendChild(d);}
 window.__shotReady=true;}
else{showTitle();if(!MAN)requestAnimationFrame(loop);}
